<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Certificates and technical learning completed by Aditya Chhatbar."
    />
    <meta name="theme-color" content="#fafafa" />
    <title>Certificates | Aditya Chhatbar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/data.js" defer></script>
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="certifications" aria-labelledby="certifications-title">
        <div class="page-width certification-content">
          <header class="section-heading">
            <div>
              <p class="section-kicker">Aditya Chhatbar</p>
              <h1 id="certifications-title">Certificates</h1>
              <p class="section-description">
                A collection of completed courses and technical training.
              </p>
            </div>
          </header>

          <div class="certificate-tools">
            <div class="search-wrap">
              <label for="certificate-search">Search certificates</label>
              <input
                id="certificate-search"
                type="search"
                placeholder="Title, organization, or topic"
                autocomplete="off"
              />
            </div>
            <div class="filter-wrap">
              <span class="filter-label" id="category-filter-label">Filter by category</span>
              <div id="category-filters" class="category-filters" aria-labelledby="category-filter-label"></div>
            </div>
          </div>

          <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
          <div id="timeline" class="timeline" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </body>
</html>
